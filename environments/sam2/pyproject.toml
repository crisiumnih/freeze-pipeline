[project]
name = "sam2-server"
version = "0.1.0"
description = "SAM2 segmentation server"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "SAM-2 @ git+https://github.com/facebookresearch/segment-anything-2.git",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
